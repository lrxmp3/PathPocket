[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathpocket"
version = "0.3.0"
description = "Reproducible fast protein microregion chemical screening"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "numpy", "scipy", "pandas", "matplotlib", "scikit-learn", "rdkit", "biopython>=1.81"]

[project.scripts]
pathpocket = "pathpocket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pathpocket = ["schemas/*.json", "_build_info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
